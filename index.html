<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboards - Only by Destino Arena</title>
<meta property="og:title" content="Dashboards - Only by Destino Arena">
<meta property="og:description" content="Dashboards de ventas en tiempo real">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --text: #f0f0f0;
    --text2: #888;
    --text3: #444;
    --accent: #c8f135;
    --accent-dim: rgba(200,241,53,0.06);
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRAIN OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 1000; opacity: 0.35;
  }

  /* ── BACKGROUND LOGO ── */
  .bg-logo {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 0;
  }
  .bg-logo img {
    width: min(70vw, 600px);
    opacity: 0.05;
    user-select: none;
  }

  /* ── HEADER ── */
  header {
    position: relative; z-index: 10;
    padding: 36px 48px 24px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .header-logo img {
    height: 38px;
    opacity: 0.95;
  }
  .header-meta {
    text-align: right;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .header-meta .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
  }
  .header-meta .season {
    font-size: 13px;
    color: var(--text2);
    margin-top: 3px;
    font-family: 'DM Mono', monospace;
  }

  /* ── MAIN ── */
  main {
    position: relative; z-index: 10;
    padding: 64px 48px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .page-intro {
    margin-bottom: 56px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .page-intro .eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    margin-bottom: 14px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }
  .page-intro h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 8vw, 96px);
    letter-spacing: 2px;
    line-height: 0.9;
    color: var(--text);
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s forwards;
  }
  .page-intro h1 span { color: var(--accent); }
  .page-intro .sub {
    margin-top: 18px;
    font-size: 14px;
    color: var(--text2);
    font-weight: 300;
    letter-spacing: 0.3px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.2s forwards;
  }

  .anteriores-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--bg);
    background: var(--accent);
    border: 1px solid var(--accent);
    padding: 10px 18px;
    border-radius: 30px;
    text-decoration: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
    font-weight: 600;
  }
  .anteriores-btn:hover {
    opacity: 0.85;
    transform: translateY(-1px);
  }

  /* ── EVENTS GRID ── */
  .events-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(260px, 340px));
    gap: 20px;
    justify-content: center;
  }

  .event-card {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    display: block;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    border: 1px solid var(--border);
    transition: border-color 0.3s ease, transform 0.4s ease;
    aspect-ratio: 1 / 1;
  }
  .event-card:nth-child(1) { animation-delay: 0.25s; }

  .event-card:hover {
    border-color: rgba(200,241,53,0.3);
    transform: translateY(-6px);
  }

  .event-card img.flyer {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s ease, filter 0.4s ease;
    filter: brightness(0.85);
  }
  .event-card:hover img.flyer {
    transform: scale(1.04);
    filter: brightness(1);
  }

  /* overlay gradiente */
  .event-card .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      to top,
      rgba(0,0,0,0.85) 0%,
      rgba(0,0,0,0.3) 45%,
      transparent 70%
    );
    transition: opacity 0.3s ease;
  }
  .event-card:hover .overlay { opacity: 0.7; }

  .event-card .info {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 28px 28px 24px;
  }
  .event-card .tag {
    display: inline-block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: 'DM Mono', monospace;
    color: var(--accent);
    background: rgba(200,241,53,0.1);
    border: 1px solid rgba(200,241,53,0.25);
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .event-card .artist {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 4vw, 44px);
    letter-spacing: 1px;
    line-height: 1;
    color: #fff;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }
  .event-card .date {
    margin-top: 6px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
  }
  .event-card .cta {
    margin-top: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .event-card:hover .cta {
    opacity: 1;
    transform: translateY(0);
  }
  .cta-arrow {
    font-size: 14px;
    transition: transform 0.2s ease;
  }
  .event-card:hover .cta-arrow { transform: translateX(4px); }

  /* ── FOOTER ── */
  footer {
    position: relative; z-index: 10;
    border-top: 1px solid var(--border);
    padding: 20px 48px;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--text3);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }

  @media (max-width: 700px) {
    header { padding: 24px 20px 20px; }
    main { padding: 40px 20px 60px; }
    .events-grid { grid-template-columns: 1fr; }
    footer { padding: 16px 20px; flex-direction: column; gap: 6px; text-align: center; }
  }
</style>
</head>
<body>

<div class="bg-logo">
  <img src="./images/logo_destino_arena.png" alt="">
</div>

<header>
  <div class="header-logo">
    <img src="./images/logo_destino_arena.png" alt="Only by Destino Arena">
  </div>
  <div class="header-meta">
    <a class="anteriores-btn" href="./anteriores.html">Eventos anteriores <span class="cta-arrow">→</span></a>
    <div>
      <div class="label">Temporada</div>
      <div class="season">2026 · Mar del Plata</div>
    </div>
  </div>
</header>

<main>
  <div class="page-intro">
    <div class="eyebrow">Dashboards de ventas</div>
    <h1>PRÓXIMOS<br><span>EVENTOS</span></h1>
    <p class="sub">Seleccioná un evento para ver el estado de ventas en tiempo real.</p>
  </div>

  <div class="events-grid">

   <a class="event-card" href="goom-gum/index.html">
  <img class="flyer" src="./images/GoomGum_QuickEntry.jpeg" alt="GOOM GUM">
  <div class="overlay"></div>
  <div class="info">
    <span class="tag">Dashboard en vivo</span>
    <div class="artist">GOOM GUM</div>
    <div class="date">Fecha · La Normandina</div>
    <div class="cta">Ver dashboard <span class="cta-arrow">→</span></div>
  </div>
</a>

  </div>
</main>

<footer>
  <span>Only by Destino Arena · Mar del Plata</span>
  <span>2026</span>
</footer>

</body>
</html>
